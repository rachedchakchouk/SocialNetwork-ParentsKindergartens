name: CI

# Compile et teste l'application à chaque pull request (dont celles de Dependabot)
# et à chaque push sur la branche principale. Les tests démarrent le contexte Spring :
# ils ont besoin d'un MySQL (root sans mot de passe, base créée automatiquement).
on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  back:
    name: Back (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SocialNetwork-ParentsKindergartens
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Compilation et tests
        shell: bash
        # UserServiceImplTest et MeetingServiceImplTest dépendent de l'état de la base et de l'ordre d'exécution
        # (ils modifient ou suppriment l'utilisateur / la réunion n° 1 sans l'avoir créé) : exclus ici, où la base
        # MySQL est vide. Le test de démarrage du contexte Spring tourne.
        run: mvn -B verify -Dtest='!UserServiceImplTest,!MeetingServiceImplTest' -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Résumé des erreurs
        if: failure()
        shell: bash
        run: |
          # Erreurs de compilation et tests en échec, remontés en annotations (lisibles sans ouvrir les journaux).
          grep -E "^\[ERROR\]" build.log | grep -vE "^\[ERROR\] *$|Re-run Maven|-> \[Help|To see the full|full stack trace|For more information" | head -40 \
            | while IFS= read -r ligne; do echo "::error::${ligne}"; done
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -lqE "FAILURE|ERROR" "$f" && grep -A12 -E "<<< (FAILURE|ERROR)" "$f" | head -30 \
              | tr '\n' ' ' | sed 's/^/::error file='"$(basename "$f")"'::/' && echo
          done
          exit 0
